name: Check atlas and quantum examples

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install numerical dependency
        run: python -m pip install -r requirements.txt
      - name: Check atlas and browser storage
        run: node --test tests/atlas.test.js
      - name: Verify the numerical lab
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check site references
        run: python scripts/check_site.py
      - name: Stage public assets
        run: python scripts/build_site.py
